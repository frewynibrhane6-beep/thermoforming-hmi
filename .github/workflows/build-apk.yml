name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Setup Cordova Project
        run: |
          cordova telemetry off
          # ፕሮጀክቱን አሁን ባለንበት ዋና ማውጫ ላይ እንዲፈጥረው እናደርጋለን
          cordova create . com.thermo.hmi "Thermoforming HMI" --force
          
          # በሪፖዚቶሪዎ ውስጥ ያለውን የ www ፎልደር እና index.html እንዳይጠፋ ወደ ቦታው መመለስ
          git checkout HEAD -- www/
          
          # የስክሪን አቀማመጥ (Landscape) እና ሌሎች ውቅሮችን በ config.xml ላይ መጨመር
          sed -i 's#</widget>#<preference name="Orientation" value="landscape" /><preference name="Fullscreen" value="true" /><preference name="android-minSdkVersion" value="24" /></widget>#' config.xml

      - name: Build debug APK
        run: |
          cordova platform add android@13
          cordova plugin add cordovarduino
          cordova build android --debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: thermoforming-hmi-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
