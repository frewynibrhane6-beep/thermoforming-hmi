name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Cordova
        run: npm install -g cordova@11

      - name: Setup Cordova and Inject Code
        run: |
          cordova telemetry off
          
          # 1. ጊዜያዊ ፎልደር ውስጥ አዲስ የኮርዶቫ ፕሮጀክት መፍጠር
          cordova create tmp_project com.thermo.hmi "Thermoforming HMI"
          
          # 2. የራስዎን የ www ፎልደር እና index.html ፋይል ወደ አዲሱ ፕሮጀክት መቅዳት
          if [ -d "www" ]; then
            cp -r www/* tmp_project/www/
          elif [ -f "index.html" ]; then
            cp index.html tmp_project/www/index.html
          fi
          
          # 3. የስክሪን አቀማመጥ (Landscape) እና ሙሉ ስክሪን ውቅሮችን በ config.xml ላይ መጨመር
          sed -i 's#</widget>#<preference name="Orientation" value="landscape" /><preference name="Fullscreen" value="true" /><preference name="android-minSdkVersion" value="24" /></widget>#' tmp_project/config.xml

      - name: Build debug APK
        working-directory: tmp_project
        run: |
          cordova platform add android@10.1.2
          cordova plugin add cordovarduino
          cordova build android --debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: thermoforming-hmi-apk
          path: tmp_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
