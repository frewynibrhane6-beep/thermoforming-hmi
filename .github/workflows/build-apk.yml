name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Install Cordova and Tools
        run: |
          npm install -g cordova@9.0.0
          npm install -g cordova-res

      - name: Setup Cordova Project
        run: |
          cordova telemetry off
          # ጊዜያዊ ንፁህ ፎልደር መፍጠር
          cordova create tmp_project com.thermo.hmi "Thermoforming HMI"
          
          # የራስዎን የ www ይዘት መቅዳት
          if [ -d "www" ]; then
            cp -r www/* tmp_project/www/
          elif [ -f "index.html" ]; then
            cp index.html tmp_project/www/index.html
          fi
          
          # Landscape እና Fullscreen ውቅሮችን መጨመር
          sed -i 's#</widget>#<preference name="Orientation" value="landscape" /><preference name="Fullscreen" value="true" /><preference name="android-minSdkVersion" value="22" /></widget>#' tmp_project/config.xml

      - name: Build debug APK
        working-directory: tmp_project
        run: |
          cordova platform add android@9.1.0
          cordova plugin add cordovarduino
          cordova build android --debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: thermoforming-hmi-apk
          path: tmp_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
