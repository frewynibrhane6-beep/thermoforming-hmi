name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Setup and Build Android Platform
        run: |
          cordova telemetry off
          
          # አዲስ ፕሮጀክት ከመፍጠር ይልቅ የኮርዶቫን ማዋቀሪያ ፋይል (config.xml) እራሳችን እንፈጥራለን
          if [ ! -f config.xml ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?><widget id="com.thermo.hmi" version="1.0.0" xmlns="http://apache.org" xmlns:cdv="http://apache.org"><name>Thermoforming HMI</name><description>Thermoforming HMI Application</description><author email="dev@thermo.com" href="http://thermo.com">Developer</author><content src="index.html" /><access origin="*" /><allow-intent href="http://*/*" /><allow-intent href="https://*/*" /><preference name="Orientation" value="landscape" /><preference name="Fullscreen" value="true" /><preference name="android-minSdkVersion" value="24" /></widget>' > config.xml
          fi
          
          # የ Android ፕላትፎርም እና መገናኛ ፕለጊን መጫን
          cordova platform add android@13
          cordova plugin add cordovarduino
          
          # APK ፋይሉን መስራት
          cordova build android --debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: thermoforming-hmi-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
