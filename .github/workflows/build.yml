name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          cordova create app com.thermo.hmi "Thermoforming HMI"
          cd app
          cp ../index.html www/index.html
          # ሙሉውን ኮድ እና ዝርዝር መዋቅር ከምንጩ ማግኘት ይችላሉ
