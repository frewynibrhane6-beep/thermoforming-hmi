name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create Cordova project and build debug APK
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GITHUB_WORKSPACE/index.html" || {
            echo "::error::index.html was not found in the repository root."
            exit 1
          }

          npm install --global cordova@12
          cordova create "$GITHUB_WORKSPACE/app" com.thermo.hmi "Thermoforming HMI"

          mkdir -p "$GITHUB_WORKSPACE/app/www"
          cp "$GITHUB_WORKSPACE/index.html" "$GITHUB_WORKSPACE/app/www/index.html"

          if [[ -f "$GITHUB_WORKSPACE/logo.png" ]]; then
            cp "$GITHUB_WORKSPACE/logo.png" "$GITHUB_WORKSPACE/app/www/logo.png"
          fi

          cat > "$GITHUB_WORKSPACE/app/config.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <widget id="com.thermo.hmi"
                  version="1.0.0"
                  xmlns="http://www.w3.org/ns/widgets"
                  xmlns:cdv="http://cordova.apache.org/ns/1.0"
                  xmlns:android="http://schemas.android.com/apk/res/android">
              <name>Thermoforming HMI</name>
              <content src="index.html" />
              <access origin="*" />
              <preference name="Orientation" value="landscape" />
              <preference name="Fullscreen" value="true" />
              <preference name="android-minSdkVersion" value="24" />
              <platform name="android">
                  <edit-config file="app/src/main/AndroidManifest.xml"
                               mode="merge"
                               target="/manifest/application/activity">
                      <activity
                          android:launchMode="singleTop"
                          android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation" />
                  </edit-config>
              </platform>
          </widget>
          XML

          cd "$GITHUB_WORKSPACE/app"
          cordova platform add android@13
          cordova plugin add cordovarduino
          cordova build android --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: thermoforming-hmi-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
