<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <title>Thermoforming HMI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        .header {
            text-align: center;
            background-color: #2e2e38;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background-color: #2a2a35;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        h2 {
            margin-top: 0;
            color: #4caf50;
            border-bottom: 2px solid #3e3e4f;
            padding-bottom: 10px;
        }
        .btn {
            display: inline-block;
            background-color: #4caf50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
            text-align: center;
        }
        .btn:active { background-color: #45a049; }
        .btn-danger { background-color: #f44336; }
        .btn-danger:active { background-color: #da190b; }
        .status {
            background-color: #15151c;
            padding: 10px;
            border-radius: 4px;
            min-height: 50px;
            font-family: monospace;
            white-space: pre-wrap;
            border: 1px solid #3e3e4f;
        }
        .setting-group {
            margin-top: 15px;
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #bbb;
        }
        input {
            width: 100%;
            padding: 10px;
            background-color: #15151c;
            border: 1px solid #3e3e4f;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Thermoforming Machine HMI Panel</h1>
    </div>

    <div class="container">
        <div class="panel">
            <h2>Connection Control</h2>
            <button class="btn" id="connectBtn">Connect to Arduino</button>
            <button class="btn btn-danger" id="disconnectBtn">Disconnect</button>
            <div class="status" id="connectionStatus">Status: Disconnected</div>
            
            <div class="setting-group">
                <label>Target Pieces (የምርት ብዛት ገደብ)፦</label>
                <input type="number" id="targetPiecesInput" value="1000">
            </div>
            <button class="btn" style="background-color: #008cba;" id="saveTargetBtn">Set Target</button>
        </div>

        <div class="panel">
            <h2>Machine Operation</h2>
            <button class="btn" id="startBtn">Start Cycle</button>
            <button class="btn btn-danger" id="stopBtn">Emergency Stop</button>
            <div class="status" id="operationLog">Log: Ready</div>
            <div class="status" style="margin-top: 10px; color: #5af78e;" id="counterLog">Total Produced: 0</div>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script>
        document.addEventListener('deviceready', onDeviceReady, false);

        var currentCount = 0;
        var targetPieces = 1000;

        function onDeviceReady() {
            log("Cordova initialized. Ready for USB connection.");
            document.getElementById('connectBtn').addEventListener('click', connectArduino);
            document.getElementById('disconnectBtn').addEventListener('click', disconnectArduino);
            document.getElementById('startBtn').addEventListener('click', startMachine);
            document.getElementById('stopBtn').addEventListener('click', stopMachine);
            document.getElementById('saveTargetBtn').addEventListener('click', setTarget);
        }

        function log(message) {
            document.getElementById('operationLog').innerText = "Log: " + message;
        }

        function updateStatus(status) {
            document.getElementById('connectionStatus').innerText = "Status: " + status;
        }

        function setTarget() {
            targetPieces = document.getElementById('targetPiecesInput').value;
            log("Target set to " + targetPieces + " pieces.");
            sendSerial("TARGET:" + targetPieces + "\n");
        }

        function connectArduino() {
            updateStatus("Connecting...");
            if (typeof serial === 'undefined') {
                updateStatus("Failed");
                log("Error: Serial plugin not found.");
                return;
            }

            serial.requestPermission(function() {
                serial.open({ baudRate: 9600, dataBits: 8, stopBits: 1, parity: 0, dtr: true, rts: true }, 
                function() {
                    updateStatus("Connected");
                    log("Connected to Arduino successfully.");
                    
                    serial.registerReadCallback(function(data) {
                        var str = String.fromCharCode.apply(null, new Uint8Array(data)).trim();
                        if(str.startsWith("COUNT:")) {
                            currentCount = str.substring(6);
                            document.getElementById('counterLog').innerText = "Total Produced: " + currentCount + " / " + targetPieces;
                        } else {
                            log("Received: " + str);
                        }
                    }, function() {});
                }, function() { updateStatus("Failed to open port"); });
            }, function() { updateStatus("Permission Denied"); });
        }

        function disconnectArduino() {
            if (typeof serial !== 'undefined') {
                serial.close(function() { updateStatus("Disconnected"); }, function() {});
            }
        }

        function startMachine() { sendSerial("START\n"); log("Sent: START"); }
        function stopMachine() { sendSerial("STOP\n"); log("Sent: STOP"); }

        function sendSerial(command) {
            if (typeof serial !== 'undefined') {
                serial.write(command, function() {}, function() {});
            } else {
                log("USB not connected!");
            }
        }
    </script>
</body>
</html>
