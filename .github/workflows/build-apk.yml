name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Create app from index.html
        run: |
          cordova telemetry off
          cordova create hmi com.thermo.hmi "Thermoforming HMI"
          cp index.html hmi/www/index.html
          sed -i 's#</widget>#<preference name="Orientation" value="landscape" /><preference name="Fullscreen" value="true" /><preference name="android-minSdkVersion" value="24" /></widget>#' hmi/config.xml

      - name: Build debug APK
        working-directory: hmi
        run: |
          cordova platform add android@13
          cordova plugin add cordovarduino
          cordova build android --debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: thermoforming-hmi-apk
          path: hmi/platforms/android/app/build/outputs/apk/debug/app-debug.apk
