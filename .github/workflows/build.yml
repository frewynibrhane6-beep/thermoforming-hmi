name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build debug APK (Cordova creates the Android project and runs Gradle)
        run: |
          npm install -g cordova
          cordova create app com.thermo.hmi "Thermoforming HMI"
          cd app
          cp ../index.html www/index.html
          if [ -f ../logo.png ]; then cp ../logo.png www/logo.png; fi
          if [ -f ../icon.png ]; then
            cp ../icon.png icon.png
            sed -i 's#</widget>#<icon src="icon.png" /></widget>#' config.xml
          fi
          sed -i 's#</widget>#<preference name="Orientation" value="sensorLandscape" /><preference name="Fullscreen" value="true" /><preference name="android-minSdkVersion" value="24" /></widget>#' config.xml
          cordova platform add android@13
          cordova plugin add cordovarduino
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thermoforming-hmi-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
