<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <title>Thermoforming HMI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            user-select: none;
        }
        .header {
            text-align: center;
            background-color: #2e2e38;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }
        .panel {
            background-color: #2a2a35;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        h2 {
            margin-top: 0;
            color: #4caf50;
            border-bottom: 2px solid #3e3e4f;
            padding-bottom: 5px;
            font-size: 18px;
        }
        .btn {
            background-color: #4caf50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
            text-align: center;
        }
        .btn:active { background-color: #45a049; }
        .btn-danger { background-color: #f44336; }
        .btn-danger:active { background-color: #da190b; }
        .btn-save { background-color: #008cba; }
        .btn-save:active { background-color: #007bb6; }
        
        .setting-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            color: #bbb;
        }
        input {
            width: 100%;
            padding: 8px;
            background-color: #15151c;
            border: 1px solid #3e3e4f;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .status {
            background-color: #15151c;
            padding: 8px;
            border-radius: 4px;
            min-height: 40px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            border: 1px solid #3e3e4f;
        }
        .counter-box {
            background-color: #1b4d3e;
            color: #5af78e;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #4caf50;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="margin:0; font-size:22px;">Thermoforming Machine HMI Panel</h1>
    </div>

    <div class="container">
        <!-- 1ኛ ክፍል: ግንኙነት እና ዋና መቆጣጠሪያ -->
        <div class="panel">
            <h2>Controls</h2>
            <button class="btn" id="connectBtn">Connect USB</button>
            <button class="btn btn-danger" id="disconnectBtn">Disconnect</button>
            <button class="btn" style="background-color:#ff9800;" id="startBtn">Start Cycle</button>
            <button class="btn btn-danger" id="stopBtn">EMERGENCY STOP</button>
            <div class="status" id="connectionStatus">Status: Disconnected</div>
            <div class="counter-box" id="counterDisplay">Produced: 0 / ---</div>
        </div>

        <!-- 2ኛ ክፍል: የጊዜ እና የምርት ብዛት ማዘዣ (Settings) -->
        <div class="panel">
            <h2>Production Settings</h2>
            <div class="setting-group">
                <label>Target Pieces (የምርት ብዛት ገደብ)፦</label>
                <input type="number" id="targetPiecesInput" value="1000">
            </div>
            <div class="setting-group">
                <label>Heater Time (ሰከንድ)፦</label>
                <input type="number" id="heatTimeInput" value="3">
            </div>
            <div class="setting-group">
                <label>Hydraulic Time (ሰከንድ)፦</label>
                <input type="number" id="hydroTimeInput" value="2">
            </div>
            <button class="btn btn-save" id="saveTimeBtn">Update Settings</button>
            <div class="status" id="timeStatus">Settings: Ready</div>
        </div>

        <!-- 3ኛ ክፍል: የፒን ማዘዣ (Pin Settings) -->
        <div class="panel">
            <h2>Pin Settings (Arduino)</h2>
            <div class="setting-group">
                <label>Heater Relay Pin #:</label>
                <input type="number" id="heatPinInput" value="13">
            </div>
            <div class="setting-group">
                <label>Hydraulic Relay Pin #:</label>
                <input type="number" id="hydroPinInput" value="12">
            </div>
            <button class="btn btn-save" id="savePinBtn">Update Pins</button>
            <div class="status" id="operationLog">Log: Ready</div>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script>
        document.addEventListener('deviceready', onDeviceReady, false);

        var currentTarget = 1000;

        function onDeviceReady() {
            document.getElementById('connectBtn').addEventListener('click', connectArduino);
            document.getElementById('disconnectBtn').addEventListener('click', disconnectArduino);
            document.getElementById('startBtn').addEventListener('click', startMachine);
            document.getElementById('stopBtn').addEventListener('click', stopMachine);
            document.getElementById('saveTimeBtn').addEventListener('click', sendProductionSettings);
            document.getElementById('savePinBtn').addEventListener('click', sendPinSettings);
        }

        function log(message) { document.getElementById('operationLog').innerText = "Log: " + message; }
        function updateStatus(status) { document.getElementById('connectionStatus').innerText = "Status: " + status; }

        function connectArduino() {
            updateStatus("Connecting...");
            if (typeof serial === 'undefined') { updateStatus("No Serial Plugin"); return; }

            serial.requestPermission(function() {
                serial.open({ baudRate: 9600, dataBits: 8, stopBits: 1, parity: 0, dtr: true, rts: true }, 
                function() {
                    updateStatus("Connected");
                    log("USB Connected.");
                    
                    serial.registerReadCallback(function(data) {
                        var str = String.fromCharCode.apply(null, new Uint8Array(data));
                        str = str.trim();
                        
                        if(str.startsWith("COUNT:")) {
                            var currentCount = str.substring(6);
                            document.getElementById('counterDisplay').innerText = "Produced: " + currentCount + " / " + currentTarget;
                        } else {
                            log("Arduino: " + str);
                        }
                    }, function() {});
                }, function() { updateStatus("Open Failed"); });
            }, function() { updateStatus("Permission Denied"); });
        }

        function disconnectArduino() {
            if (typeof serial !== 'undefined') {
                serial.close(function() { updateStatus("Disconnected"); }, function() {});
            }
        }

        function startMachine() { sendSerial("START\n"); }
        function stopMachine() { sendSerial("STOP\n"); }

        function sendProductionSettings() {
            var target = document.getElementById('targetPiecesInput').value;
            var heatTime = document.getElementById('heatTimeInput').value;
            var hydroTime = document.getElementById('hydroTimeInput').value;
            currentTarget = target;
            
            sendSerial("SET_PROD:" + target + "," + heatTime + "," + hydroTime + "\n");
            document.getElementById('counterDisplay').innerText = "Produced: 0 / " + target;
            document.getElementById('timeStatus').innerText = "Sent: Target=" + target + ", H=" + heatTime + "s, Y=" + hydroTime + "s";
        }

        function sendPinSettings() {
            var heatPin = document.getElementById('heatPinInput').value;
            var hydroPin = document.getElementById('hydroPinInput').value;
            sendSerial("SET_PIN:" + heatPin + "," + hydroPin + "\n");
            log("Pins sent: H=" + heatPin + ", Y=" + hydroPin);
        }

        function sendSerial(command) {
            if (typeof serial !== 'undefined') {
                serial.write(command, function() {}, function() {});
            } else {
                log("USB not connected!");
            }
        }
    </script>
</body>
</html>
