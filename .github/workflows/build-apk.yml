name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Build Cordova APK
      run: |
        # ስሪቱን ወደ 12.0.0 በመቆለፍ ማውረዱን እናፈጥነዋለን
        npm install -g cordova@12.0.0
        cordova create app com.thermo.hmi2 "Thermoforming HMI v2"
        cd app
        cp ../index.html www/index.html
        
        # ፎቶው ከሌለ ግንባታው እንዳይቋረጥ የማረጋገጫ ህግ እንጨምራለን
        if [ -f "../logo.png" ]; then
          cp ../logo.png www/logo.png
        fi
        
        sed -i 's#</widget>#<preference name="Orientation" value="landscape" /><preference name="Fullscreen" value="true" /><preference name="android-minSdkVersion" value="24" /></widget>#' config.xml
        cordova platform add android@13
        cordova plugin add cordovarduino
        cordova build android --debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: thermoforming-hmi-apk-v2
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
