name: Build Cordova APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Cordova APK
      run: |
        npm install -g cordova
        cordova create app com.thermo.hmi "Thermoforming HMI"
        cd app
        cp ../index.html www/index.html
        echo '  LENTFRsm0gnUXZFuYhGLv7/v7W399HAYJlnGEIgP6kmvQ7QHEU6GklxqlJOZUOQGNu9Mk0DrQkykEzBeloCxJnCQyvwy4rmMjTEEBOUmvouF1jKvyXgVqSTaVUwkADgOLtwwHpx8JCyyTdhDhgHsj6OyzistA2ApuOTH5ioFTsMMBpeZFC0y3JUOWpAN3mce83wNFESZCQne1idi8/IcFM7tIR0De8BplAKZRnmoaOin4Lh23JDsRXpIjGv/Wdf' | base64 -d > www/icon.png
        cordova platform add android
        cordova build android --release
